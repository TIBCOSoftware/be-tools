[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "be-tools-mcp"
version = "0.1.0"
description = "MCP server wrapping be-tools BE container build/test scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
be-tools-mcp = "be_tools_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["be_tools_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
